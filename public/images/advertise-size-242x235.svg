<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 242 235" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Deep Luxury Royal Burgundy/Crimson Background Gradient -->
    <linearGradient id="bgGrad242" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0404" />
      <stop offset="40%" stop-color="#450A0A" />
      <stop offset="70%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#180303" />
    </linearGradient>

    <!-- Metallic Gold Ribbon Gradient -->
    <linearGradient id="goldRibbon242" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="75%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Pill Button Metallic Gradient -->
    <linearGradient id="pillGold242" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="30%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow242" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <radialGradient id="centerGlow242" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DA251D" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#7F1D1D" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Background (Edge-to-Edge Fill) -->
  <rect width="100%" height="100%" fill="url(#bgGrad242)" />
  <rect width="100%" height="100%" fill="url(#centerGlow242)" />

  <!-- 2. Elegant Flowing Golden Wave Ribbons -->
  <path d="M-10,38 Q60,-2 121,30 T252,18" fill="none" stroke="url(#goldRibbon242)" stroke-width="2.2" />
  <path d="M-10,50 Q70,10 130,40 T252,28" fill="none" stroke="#FDE047" stroke-width="0.8" stroke-opacity="0.45" />
  <path d="M-10,192 Q60,236 130,190 T252,208" fill="none" stroke="url(#goldRibbon242)" stroke-width="2.2" />
  <path d="M-10,204 Q70,246 140,200 T252,218" fill="none" stroke="#FDE047" stroke-width="0.8" stroke-opacity="0.45" />

  <!-- 3. Fine Golden Inner Border -->
  <rect x="2" y="2" width="238" height="231" rx="14" fill="none" stroke="url(#goldRibbon242)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- 4. Sparkles -->
  <circle cx="28" cy="40" r="1.5" fill="#FDE047" opacity="0.8" />
  <circle cx="214" cy="36" r="1.5" fill="#FDE047" opacity="0.8" />
  <circle cx="36" cy="190" r="1.5" fill="#FDE047" opacity="0.8" />
  <circle cx="206" cy="194" r="1.5" fill="#FDE047" opacity="0.8" />

  <!-- 5. Main Text: ADVERTISE WITH US (Safe Centered) -->
  <text 
    x="121" 
    y="86" 
    text-anchor="middle" 
    font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="12.5" 
    font-weight="900" 
    letter-spacing="1" 
    fill="#FFFFFF" 
    filter="url(#shadow242)"
  >
    ADVERTISE WITH US
  </text>

  <!-- 6. Metallic Gold Pill Badge: SIZE: 242 x 235 PX -->
  <g filter="url(#shadow242)">
    <rect 
      x="36" 
      y="108" 
      width="170" 
      height="34" 
      rx="17" 
      fill="url(#pillGold242)" 
      stroke="#FEF08A" 
      stroke-width="1.2"
    />
    <text 
      x="121" 
      y="130" 
      text-anchor="middle" 
      font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
      font-size="11.5" 
      font-weight="900" 
      letter-spacing="0.6" 
      fill="#450A0A"
    >
      SIZE: 242 x 235 PX
    </text>
  </g>

  <!-- 7. Subtitle: Ratio & Format -->
  <text 
    x="121" 
    y="170" 
    text-anchor="middle" 
    font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="9" 
    font-weight="600" 
    letter-spacing="0.6" 
    fill="#FCA5A5" 
    opacity="0.95"
  >
    ECAM Portal  •  JPG / PNG / SVG
  </text>
</svg>
