<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Deep Luxury Royal Burgundy/Crimson Background Gradient -->
    <linearGradient id="bgGrad700" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0404" />
      <stop offset="35%" stop-color="#450A0A" />
      <stop offset="65%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#180303" />
    </linearGradient>

    <!-- Metallic Gold Ribbon Gradient 1 -->
    <linearGradient id="goldRibbon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="75%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.8" />
    </linearGradient>

    <!-- Metallic Gold Ribbon Gradient 2 -->
    <linearGradient id="goldRibbon2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.6" />
    </linearGradient>

    <!-- Pill Button Metallic Gradient -->
    <linearGradient id="pillGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FACC15" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Radial Crimson Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DA251D" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7F1D1D" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Background (100% Edge-to-Edge Solid Fill) -->
  <rect width="100%" height="100%" fill="url(#bgGrad700)" />
  <rect width="100%" height="100%" fill="url(#centerGlow)" />

  <!-- 2. Elegant Flowing Golden Wave Ribbons (Top) -->
  <path d="M-20,35 Q160,-15 340,30 T720,15" fill="none" stroke="url(#goldRibbon1)" stroke-width="2.5" />
  <path d="M-20,50 Q180,-5 360,42 T720,25" fill="none" stroke="url(#goldRibbon2)" stroke-width="1.2" stroke-opacity="0.6" />
  <path d="M-20,20 Q140,55 350,15 T720,38" fill="none" stroke="#FDE047" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- 3. Elegant Flowing Golden Wave Ribbons (Bottom) -->
  <path d="M-20,150 Q170,195 360,148 T720,165" fill="none" stroke="url(#goldRibbon1)" stroke-width="2.5" />
  <path d="M-20,135 Q190,185 380,138 T720,155" fill="none" stroke="url(#goldRibbon2)" stroke-width="1.2" stroke-opacity="0.6" />
  <path d="M-20,165 Q150,125 340,165 T720,142" fill="none" stroke="#FDE047" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- 4. Subtle Golden Sparkle Dust Particles -->
  <g fill="#FDE047" opacity="0.6">
    <circle cx="85" cy="45" r="1.5" />
    <circle cx="120" cy="140" r="1.2" />
    <circle cx="210" cy="35" r="1.8" />
    <circle cx="260" cy="155" r="1.2" />
    <circle cx="480" cy="30" r="1.5" />
    <circle cx="530" cy="145" r="1.8" />
    <circle cx="610" cy="40" r="1.2" />
    <circle cx="645" cy="135" r="1.5" />
    <!-- Small Cross Stars -->
    <path d="M95,120 L97,120 M96,119 L96,121" stroke="#FEF08A" stroke-width="1" />
    <path d="M590,65 L592,65 M591,64 L591,66" stroke="#FEF08A" stroke-width="1" />
  </g>

  <!-- 5. Fine Golden Inner Border -->
  <rect x="1" y="1" width="698" height="178" fill="none" stroke="url(#goldRibbon1)" stroke-width="1" stroke-opacity="0.3" />

  <!-- 6. Main Text: ADVERTISE WITH US -->
  <text 
    x="350" 
    y="68" 
    text-anchor="middle" 
    font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="28" 
    font-weight="900" 
    letter-spacing="3.5" 
    fill="#FFFFFF" 
    filter="url(#textGlow)"
  >
    ADVERTISE WITH US
  </text>

  <!-- 7. Metallic Gold Pill Badge: SIZE: 700 x 180 PX -->
  <g filter="url(#pillGlow)">
    <rect 
      x="215" 
      y="90" 
      width="270" 
      height="38" 
      rx="19" 
      fill="url(#pillGold)" 
      stroke="#FEF08A" 
      stroke-width="1.2"
    />
    <text 
      x="350" 
      y="114" 
      text-anchor="middle" 
      font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
      font-size="16" 
      font-weight="900" 
      letter-spacing="1.5" 
      fill="#450A0A"
    >
      SIZE: 700 x 180 PX
    </text>
  </g>

  <!-- 8. Subtitle: Ratio & Format -->
  <text 
    x="350" 
    y="152" 
    text-anchor="middle" 
    font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="12" 
    font-weight="600" 
    letter-spacing="1.5" 
    fill="#FCA5A5" 
    opacity="0.95"
  >
    ECAM Premier Showcase Ribbon  •  JPG / PNG / SVG
  </text>
</svg>
